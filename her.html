<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Her View">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-her-192.png">
<link rel="manifest" href="her-manifest.json">
<title>Her View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@100;200;300;400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--surface:#0d0d0d;--border:#1e1e1e;
  --p:#c87090;--pdim:rgba(200,112,144,.5);--pfaint:rgba(200,112,144,.1);
  --text:#f8f8f8;--text2:#a8a8a8;--text3:#686868;
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.6}
#app{max-width:520px;margin:0 auto;padding:0 16px 80px}
.nav-tabs{display:flex;border-bottom:1px solid rgba(200,112,144,.15);margin-bottom:20px}
.nav-tab{flex:1;padding:14px 8px;font-family:'Josefin Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#555;text-align:center;cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;transition:all .15s}
.nav-tab.active{color:var(--p);border-bottom-color:var(--p)}
.tab-panel{display:none}.tab-panel.active{display:block}
.hdr{text-align:center;padding:36px 0 24px;border-bottom:1px solid var(--pfaint);margin-bottom:24px}
.hdr-title{font-family:'Cormorant',serif;font-size:34px;font-weight:300;color:var(--p);letter-spacing:.08em;margin-bottom:6px}
.hdr-sub{font-size:12px;color:var(--pdim);letter-spacing:.08em;text-transform:uppercase}
.hdr-gen{font-size:11px;color:#333;margin-top:10px}
.hdr-stale{font-size:11px;color:#e05828;margin-top:6px;font-style:italic}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-rose{background:rgba(200,112,144,.04);border-color:rgba(200,112,144,.2)}
.sec-lbl{font-family:'Josefin Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--pdim);margin-bottom:10px}
.entry-list{border:1px solid rgba(200,112,144,.15);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.entry-row{border-top:1px solid rgba(200,112,144,.08)}.entry-row:first-child{border-top:none}
.entry-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.entry-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.entry-meta{flex:1;min-width:0}
.entry-date-lbl{font-family:'Josefin Sans',sans-serif;font-size:10px;color:var(--pdim);letter-spacing:.06em;margin-bottom:2px}
.entry-preview{font-size:13px;color:rgba(255,255,255,.4);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-chev{font-size:16px;color:rgba(200,112,144,.28);flex-shrink:0;transition:transform .18s}
.entry-body{display:none;padding:0 14px 14px;border-top:1px solid rgba(200,112,144,.06)}
.entry-body.open{display:block}
.entry-note{font-size:15px;color:rgba(255,255,255,.8);line-height:1.75;margin:12px 0 0;font-style:italic}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{border:1px solid rgba(200,112,144,.12);border-radius:var(--radius);padding:12px;text-align:center;background:rgba(200,112,144,.03)}
.stat-val{font-family:'Cormorant',serif;font-size:22px;color:var(--p);font-weight:300;line-height:1}
.stat-lbl{font-family:'Josefin Sans',sans-serif;font-size:9px;color:rgba(200,112,144,.38);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.ev-input{width:100%;background:#000;border:1px solid #2a2a2a;border-radius:6px;padding:10px 12px;color:#fff;font-size:15px;font-family:'Inter',sans-serif;outline:none;display:block;color-scheme:dark}
.ev-input:focus{border-color:rgba(200,112,144,.4)}
.ev-btn{font-family:'Josefin Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:11px 18px;border-radius:6px;cursor:pointer;border:1px solid #222;background:#0a0a0a;color:#666}
.ev-btn.primary{border-color:rgba(200,112,144,.4);background:rgba(200,112,144,.08);color:var(--p)}
.ev-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--p);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.ev-date-lbl{font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.ev-title-txt{font-size:15px;color:var(--text);margin-bottom:2px}
.ev-note-txt{font-size:13px;color:var(--text3);font-style:italic;margin-top:3px}
.ev-del{background:none;border:none;color:#333;font-size:14px;cursor:pointer;padding:0 4px;flex-shrink:0}
.footer{text-align:center;padding:28px 0 8px;font-family:'Josefin Sans',sans-serif;font-size:10px;color:#2a2a2a;letter-spacing:.12em;text-transform:uppercase}
.msg{text-align:center;padding:80px 24px;font-style:italic;color:var(--pdim);line-height:1.8}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid rgba(200,112,144,.3);color:var(--p);font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:.1em;padding:10px 20px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-title">Her View</div>
    <div class="hdr-sub">A window into his inner weather</div>
    <div id="hdr-meta"></div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showTab('mood')">How He's Been</button>
    <button class="nav-tab" onclick="showTab('events')">My Events</button>
  </div>
  <div id="tab-mood" class="tab-panel active"><div id="mood-root"><div class="msg">Loading\u2026</div></div></div>
  <div id="tab-events" class="tab-panel"><div id="events-root"></div></div>
</div>
<div id="toast"></div>

<script>
var MOOD_LABELS={1:'Collapsed',2:'Low',3:'Difficult',4:'Flat',5:'Neutral',6:'Stable',7:'Grounded',8:'Focused',9:'Sharp',10:'Sovereign'};
var EV_KEY='imperium_her_events';

function scorePhrase(s){var P={1:'He\'s really struggling right now \u2014 this is a hard day for him.',2:'He\'s having a rough day. A little extra warmth from you would go a long way.',3:'Things feel heavy for him today. He\'s pushing through something difficult.',4:'He\'s a bit off today \u2014 not quite himself, but he\'s still showing up.',5:'He\'s holding steady \u2014 not really up or down, just getting through.',6:'He\'s doing okay today \u2014 feeling solid and level.',7:'He\'s feeling really good today \u2014 centered and at ease.',8:'He\'s in a strong place right now \u2014 sharp, purposeful, and locked in.',9:'He\'s having a great day \u2014 really clear and full of energy.',10:'He\'s at his absolute best today. This is him fully in his element.'};return P[s]||'He had an ordinary kind of day.';}
function dotColor(s){return s<=3?'#c55':s<=5?'#888':s<=7?'#18c48a':'#f0c040';}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function todayStr(){return new Date().toISOString().slice(0,10);}

function showTab(name){
  document.querySelectorAll('.nav-tab').forEach(function(b,i){b.classList.toggle('active',['mood','events'][i]===name);});
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='events')renderEvents();
}

// ── MOOD ─────────────────────────────────────────────────────────────────────
function renderMood(){
  var hash=location.hash.replace(/^#/,'');
  var meta=document.getElementById('hdr-meta');
  if(!hash){document.getElementById('mood-root').innerHTML='<div class="msg">No mood data found.<br>Ask him to share a fresh link.</div>';return;}
  var data;
  try{data=JSON.parse(decodeURIComponent(escape(atob(hash))));}
  catch(e){document.getElementById('mood-root').innerHTML='<div class="msg">Link looks corrupted.<br>Ask him to send a new one.</div>';return;}
  var ml=data.d||{};
  var genAt=data.g?new Date(data.g):null;
  var entries=Object.entries(ml).filter(function(e){return e[1]&&e[1].s;}).sort(function(a,b){return a[0]<b[0]?-1:1;});
  if(!entries.length){document.getElementById('mood-root').innerHTML='<div class="msg">Nothing logged yet \u2014 check back soon.</div>';return;}
  var scores=entries.map(function(e){return e[1].s;});
  var avg=scores.reduce(function(a,b){return a+b;},0)/scores.length;
  var r7=scores.slice(-7);var avg7=r7.reduce(function(a,b){return a+b;},0)/r7.length;
  var trendMsg=avg7<=3.5?'He\'s been going through a tough stretch lately. He may not show it openly \u2014 your warmth right now means more than you know.':avg7<=5?'He\'s had some harder days and some okay ones lately. Just being steady and present for him helps more than you might realise.':avg7<=7?'He\'s been doing pretty well overall \u2014 feeling grounded and like himself. Things are in a good place for him right now.':'He\'s been in a really strong place lately \u2014 energized, clear, and feeling like himself. This is a good season for him.';
  var overallWord=avg>=7.5?'Really well':avg>=6?'Pretty good':avg>=4.5?'Getting by':'Hard stretch';
  var todayEntry=ml[todayStr()]||null;
  var lastKey=entries[entries.length-1][0];
  var daysSince=Math.floor((Date.now()-new Date(lastKey).getTime())/86400000);
  if(meta){meta.innerHTML=(genAt?'<div class="hdr-gen">Updated \u00b7 '+genAt.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+'</div>':'')+(daysSince>3?'<div class="hdr-stale">Last entry '+daysSince+' days ago \u2014 ask for a fresh link.</div>':'');}
  var h='';
  h+='<div class="card card-rose"><div class="sec-lbl">Lately</div><p style="font-size:15px;color:rgba(255,255,255,.8);line-height:1.8;font-style:italic;margin:0">'+trendMsg+'</p></div>';
  if(todayEntry){var tt=todayEntry.p||scorePhrase(todayEntry.s);h+='<div class="card card-rose"><div class="sec-lbl">Today</div><p style="font-size:15px;color:rgba(255,255,255,.82);line-height:1.72;font-style:italic;margin:0">'+tt+'</p></div>';}
  if(entries.length>=3){h+='<div class="stat-grid"><div class="stat-card"><div class="stat-val">'+overallWord+'</div><div class="stat-lbl">Overall lately</div></div><div class="stat-card"><div class="stat-val" style="color:rgba(255,255,255,.3)">'+entries.length+'</div><div class="stat-lbl">Days logged</div></div></div>';}
  h+='<div style="font-family:\'Josefin Sans\',sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(200,112,144,.4);margin-bottom:8px">Tap a day to read</div>';
  h+='<div class="entry-list">';
  entries.slice().reverse().forEach(function(e){
    var dk=e[0];var s=e[1].s;var txt=e[1].p||scorePhrase(s);var lbl=MOOD_LABELS[s]||'';
    var preview=txt.length>54?txt.slice(0,54)+'\u2026':txt;
    h+='<div class="entry-row"><div class="entry-hdr" onclick="toggleE(\''+dk+'\')">';
    h+='<div class="entry-dot" style="background:'+dotColor(s)+'"></div>';
    h+='<div class="entry-meta"><div class="entry-date-lbl">'+dk.slice(5)+' \u00b7 '+lbl+'</div><div class="entry-preview">'+preview+'</div></div>';
    h+='<div id="ec-'+dk+'" class="entry-chev">\u203a</div></div>';
    h+='<div id="eb-'+dk+'" class="entry-body"><p class="entry-note">'+txt+'</p></div></div>';
  });
  h+='</div><div class="footer">The Imperium \u00b7 The Sovereign Traditions</div>';
  document.getElementById('mood-root').innerHTML=h;
}

function toggleE(dk){
  var body=document.getElementById('eb-'+dk);var chev=document.getElementById('ec-'+dk);if(!body)return;
  var open=body.classList.contains('open');
  document.querySelectorAll('.entry-body').forEach(function(el){el.classList.remove('open');});
  document.querySelectorAll('.entry-chev').forEach(function(el){el.style.transform='';el.style.color='rgba(200,112,144,.28)';});
  if(!open){body.classList.add('open');if(chev){chev.style.transform='rotate(90deg)';chev.style.color='#c87090';}}
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
function getEvents(){try{return JSON.parse(localStorage.getItem(EV_KEY))||[];}catch(e){return[];}}
function saveEvents(ev){try{localStorage.setItem(EV_KEY,JSON.stringify(ev));}catch(e){}}

function fmtDate(ds){
  var today=new Date();today.setHours(0,0,0,0);
  var d=new Date(ds+'T00:00:00');var diff=Math.round((d-today)/86400000);
  if(diff===0)return'Today';if(diff===1)return'Tomorrow';if(diff===-1)return'Yesterday';
  if(diff>1&&diff<=14)return'In '+diff+' days';
  if(diff<-1&&diff>=-14)return Math.abs(diff)+' days ago';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:Math.abs(diff)>300?'numeric':undefined});
}

function renderEvents(){
  var el=document.getElementById('events-root');if(!el)return;
  var events=getEvents();
  var today=new Date();today.setHours(0,0,0,0);
  var upcoming=events.filter(function(e){return new Date(e.date+'T00:00:00')>=today;});
  var past=events.filter(function(e){return new Date(e.date+'T00:00:00')<today;});
  var h='';
  h+='<h2 style="font-family:\'Cormorant\',serif;font-size:24px;font-weight:300;color:#fff;letter-spacing:.1em;margin-bottom:4px">My Events</h2>';
  h+='<p style="font-size:13px;color:var(--text3);margin-bottom:16px;line-height:1.6">Doctor\'s appointments, reminders, anything that\'s yours. Lives on your device only.</p>';
  h+='<div id="add-ev-form" style="display:none;background:#0a0a0a;border:1px solid rgba(200,112,144,.2);border-radius:8px;padding:14px;margin-bottom:12px">';
  h+='<div class="sec-lbl" style="margin-bottom:10px">New Event</div>';
  h+='<input type="text" id="ev-title" class="ev-input" placeholder="Doctor appointment \u00b7 Reminder \u00b7 Note\u2026" style="margin-bottom:8px">';
  h+='<input type="date" id="ev-date" class="ev-input" style="margin-bottom:8px">';
  h+='<textarea id="ev-note" class="ev-input" placeholder="Details, location, notes (optional)" rows="2" style="margin-bottom:10px;resize:none"></textarea>';
  h+='<div style="display:flex;gap:8px"><button onclick="submitEvent()" class="ev-btn primary" style="flex:1">Add</button><button onclick="hideAddForm()" class="ev-btn" style="flex:1">Cancel</button></div>';
  h+='</div>';
  h+='<button onclick="showAddForm()" id="add-ev-btn" class="ev-btn primary" style="width:100%;margin-bottom:16px">+ Add Event</button>';
  if(!events.length){
    h+='<div style="font-size:14px;color:#333;font-style:italic;text-align:center;padding:24px;border:1px dashed #1a1a1a;border-radius:8px">No events yet.</div>';
  } else {
    upcoming.forEach(function(ev){
      var ds=fmtDate(ev.date);
      var col=ds==='Today'?'#c87090':ds==='Tomorrow'?'#f0c040':'#5888b0';
      h+='<div class="ev-card" style="border-left-color:'+col+'">';
      h+='<div style="display:flex;align-items:flex-start;gap:8px">';
      h+='<div style="flex:1;min-width:0"><div class="ev-date-lbl" style="color:'+col+'">'+ds+' \u00b7 '+ev.date.slice(5).replace('-','/')+'</div>';
      h+='<div class="ev-title-txt">'+ev.title+'</div>';
      if(ev.note)h+='<div class="ev-note-txt">'+ev.note+'</div>';
      h+='</div><button onclick="delEvent(\''+ev.id+'\')" class="ev-del">\u2715</button></div></div>';
    });
    if(past.length){
      h+='<div onclick="togglePast()" id="past-toggle" style="font-family:\'Josefin Sans\',sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#2a2a2a;cursor:pointer;text-align:center;padding:12px 0;margin-top:4px">Past events ('+past.length+')</div>';
      h+='<div id="past-list" style="display:none">';
      past.slice().reverse().forEach(function(ev){
        h+='<div class="ev-card" style="opacity:.35;border-left-color:#333">';
        h+='<div style="display:flex;align-items:flex-start;gap:8px">';
        h+='<div style="flex:1;min-width:0"><div class="ev-date-lbl" style="color:#555">'+fmtDate(ev.date)+' \u00b7 '+ev.date.slice(5).replace('-','/')+'</div>';
        h+='<div class="ev-title-txt" style="color:#666">'+ev.title+'</div>';
        if(ev.note)h+='<div class="ev-note-txt">'+ev.note+'</div>';
        h+='</div><button onclick="delEvent(\''+ev.id+'\')" class="ev-del">\u2715</button></div></div>';
      });
      h+='</div>';
    }
  }
  h+='<div class="footer">Stored on your device only.</div>';
  el.innerHTML=h;
  var di=document.getElementById('ev-date');
  if(di&&!di.value)di.value=todayStr();
}

function showAddForm(){
  var f=document.getElementById('add-ev-form');var b=document.getElementById('add-ev-btn');
  if(f)f.style.display='block';if(b)b.style.display='none';
  setTimeout(function(){var t=document.getElementById('ev-title');if(t)t.focus();},100);
}
function hideAddForm(){
  var f=document.getElementById('add-ev-form');var b=document.getElementById('add-ev-btn');
  if(f)f.style.display='none';if(b)b.style.display='block';
}
function submitEvent(){
  var te=document.getElementById('ev-title');var de=document.getElementById('ev-date');var ne=document.getElementById('ev-note');
  var title=te?te.value.trim():'';var date=de?de.value:'';var note=ne?ne.value.trim():'';
  if(!title){toast('Add a title.');return;}if(!date){toast('Pick a date.');return;}
  var events=getEvents();
  events.push({id:Date.now().toString(),date:date,title:title,note:note,created:Date.now()});
  events.sort(function(a,b){return a.date<b.date?-1:1;});
  saveEvents(events);toast('Event added.');
  hideAddForm();renderEvents();
}
function delEvent(id){
  saveEvents(getEvents().filter(function(e){return e.id!==id;}));
  renderEvents();toast('Removed.');
}
function togglePast(){
  var l=document.getElementById('past-list');var t=document.getElementById('past-toggle');
  if(!l)return;var o=l.style.display==='block';
  l.style.display=o?'none':'block';if(t)t.style.color=o?'#2a2a2a':'#666';
}

renderMood();
</script>
</body>
</html>
